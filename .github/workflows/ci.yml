name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Separate caller workflows so concurrent release validations do not cancel each other.
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quality checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        run: npm run audit:security

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build and check TypeScript
        run: npm run build

  container:
    name: Container smoke test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag redux-state-demo:ci .

      - name: Check that the container serves the application
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name redux-state-demo-ci \
            --publish 127.0.0.1:3000:3000 redux-state-demo:ci
          trap 'docker logs redux-state-demo-ci; docker rm --force redux-state-demo-ci' EXIT
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 1 --retry-all-errors \
            --max-time 5 --retry-max-time 60 \
            http://127.0.0.1:3000/ --output /tmp/redux-state-demo.html
          grep -q 'Redux State Demo' /tmp/redux-state-demo.html
          grep -q 'Demo login' /tmp/redux-state-demo.html
          node scripts/check-security-headers.mjs http://127.0.0.1:3000
