name: Publish application image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to GHCR
    needs: validate
    # Automatic delivery accepts only successful main pushes from this repository.
    if: >-
      ${{ !cancelled() &&
          ((github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            needs.validate.result == 'skipped') ||
           (github.event_name != 'workflow_run' && needs.validate.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # workflow_run's github.sha can point at a newer commit than the tested run.
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Node.js for HTTP checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: echo "name=ghcr.io/${REPOSITORY,,}/app" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          # Only the explicit stable-release rule below may update latest.
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ env.SOURCE_SHA }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

      - name: Build and load application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=application-image
          cache-to: type=gha,mode=max,scope=application-image

      - name: Smoke test the image to be published
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ env.SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          bash scripts/smoke-test-container.sh "$IMAGE"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ env.SOURCE_SHA }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"
          digest="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          printf '%s\n' '### Published application image' '' \
            "Commit: $SOURCE_SHA" "Image: $digest" >> "$GITHUB_STEP_SUMMARY"
